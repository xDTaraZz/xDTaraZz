<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 846 64" width="100%" role="img" aria-label="Origin Story">
  <defs>
    <style>
      .comic { font-family: 'Arial Black', 'Segoe UI Black', Impact, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, monospace; }
    </style>
  </defs>

  <!-- Web strand across page with anchor knot on the right where Spidey hangs down -->
  <line x1="0" y1="40" x2="846" y2="40" stroke="#e2e8f0" stroke-opacity="0.35" stroke-width="2.2"/>
  <line x1="0" y1="40" x2="480" y2="40" stroke="#ff1744" stroke-width="2.8"/>

  <!-- Web anchor radial knot on right side (~x=736 aligns with align=right width=215 image center) -->
  <g transform="translate(736, 40)">
    <path d="M -26,0 L 26,0 M -18,-12 L 18,12 M -18,12 L 18,-12 M 0,0 L 0,24" stroke="#ffffff" stroke-opacity="0.65" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="9" fill="#0d1326" stroke="#00e5ff" stroke-width="2"/>
    <circle cx="0" cy="0" r="3.5" fill="#ffe600"/>
  </g>

  <!-- Angled Yellow Narrator Caption Box ("MEANWHILE IN BANGKOK...") -->
  <g transform="translate(6, 8) rotate(-0.8)">
    <polygon points="6,6 376,4 370,50 2,52" fill="#ff1744"/>
    <polygon points="2,2 372,0 366,46 -2,48" fill="#ffe600" stroke="#05070e" stroke-width="2.5"/>
    <text x="18" y="31" class="comic" font-size="19" font-weight="900" fill="#070912" letter-spacing="0.8">MEANWHILE IN BANGKOK...</text>
  </g>

  <rect x="400" y="25" width="212" height="26" rx="3" fill="#0b0f1e" stroke="#334155" stroke-width="1.4"/>
  <text x="506" y="42" text-anchor="middle" class="mono" font-size="11.5" font-weight="700" fill="#00e5ff" letter-spacing="0.6">EARTH-1610 · UTC+07:00</text>
</svg>